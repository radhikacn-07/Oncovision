<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}OncoVision{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css', v='20260910-self-exam-mobile-fit') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/doctor-light.css', v='20260825-live-reports') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/clinical-resources.css', v='20260825-clinical-resources') }}" />
    {% block head %}{% endblock %}
  </head>
  <body data-login-error="{{ login_error|default('', true)|e }}">
    {% block body %}{% endblock %}

    <a href="{{ url_for('chat') }}" class="chat-launcher" aria-label="Open AI assistant">
      <span>💬</span>
    </a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/oncovision.js', v='20260825-auth-fix') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
